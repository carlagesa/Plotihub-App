name: Promote Elastic Beanstalk Application

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "api/**"
      - "core/**"
      - "requirements.txt"
      - ".github/workflows/deploy-eb.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: staging

env:
  AWS_REGION: af-south-1
  EB_APPLICATION: plotihub

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.select.outputs.environment }}
    steps:
      - id: select
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "environment=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: select
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python manage.py test

  terraform-plan:
    needs: [select, test]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.select.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - name: Format and validate
        env:
          ENVIRONMENT: ${{ needs.select.outputs.environment }}
        shell: bash
        run: |
          cd "terraform/environments/${ENVIRONMENT}"
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  deploy:
    needs: [select, test, terraform-plan]
    if: ${{ needs.select.outputs.environment != 'prod' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.select.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install awsebcli
      - name: Package application
        run: |
          mkdir deploy
          cp -r api core manage.py requirements.txt deploy/
          echo "web: gunicorn core.wsgi:application --bind 0.0.0.0:8000" > deploy/Procfile
          cd deploy
          zip -r ../django-app.zip .
      - name: Upload application version
        env:
          ENVIRONMENT: ${{ needs.select.outputs.environment }}
        run: |
          VERSION="plotihub-${ENVIRONMENT}-${GITHUB_SHA::7}"
          aws s3 cp django-app.zip \
            "s3://plotihub-deploys-${ENVIRONMENT}/${ENVIRONMENT}/django-app.zip"
          aws elasticbeanstalk create-application-version \
            --application-name "${EB_APPLICATION}" \
            --version-label "${VERSION}" \
            --source-bundle S3Bucket="plotihub-deploys-${ENVIRONMENT}",S3Key="${ENVIRONMENT}/django-app.zip" \
            --region "${AWS_REGION}"
          eb deploy "plotihub-${ENVIRONMENT}" \
            --version "${VERSION}" \
            --region "${AWS_REGION}"
